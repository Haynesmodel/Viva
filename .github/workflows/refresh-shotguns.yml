name: Refresh weekly Shotguns

on:
  workflow_dispatch:
    inputs:
      season:
        description: Viva season to check
        required: true
        default: '2026'
        type: string
      week:
        description: Finalized week to check; blank checks the prior ESPN period
        required: false
        type: string
  schedule:
    - cron: '47 10 * * 2'
      timezone: America/Chicago

concurrency:
  group: viva-shotguns-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || vars.VIVA_ESPN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIVA_ESPN_LEAGUE_ID: ${{ vars.VIVA_ESPN_LEAGUE_ID }}
      VIVA_SEASON: ${{ inputs.season || vars.VIVA_ESPN_SEASON }}
      REPORT_WEEK: ${{ inputs.week }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Select npm 11.18.0
        run: npm install --global npm@11.18.0
      - name: Install dependencies
        run: npm ci
      - name: Validate required automation configuration
        run: |
          test -n "$VIVA_SEASON"
          test -n "$VIVA_ESPN_LEAGUE_ID"
      - name: Find the Shotguns review branch
        id: review_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin automation/shotguns-weekly >/dev/null 2>&1; then
            echo "remote_branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote_branch_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Continue the existing review branch
        if: steps.review_branch.outputs.remote_branch_exists == 'true'
        run: |
          git fetch origin automation/shotguns-weekly
          git switch -C automation/shotguns-weekly origin/automation/shotguns-weekly
      - name: Detect and promote new Shotguns owed
        env:
          ESPN_S2: ${{ secrets.VIVA_ESPN_S2 }}
          ESPN_SWID: ${{ secrets.VIVA_ESPN_SWID }}
        run: |
          report_args=(--league-id "$VIVA_ESPN_LEAGUE_ID" --season "$VIVA_SEASON" --promote)
          if [ -n "$REPORT_WEEK" ]; then
            report_args+=(--week "$REPORT_WEEK")
          fi
          python3 scripts/report_shotguns_weekly.py "${report_args[@]}"
          npm run test:assets
      - name: Create or update the review branch
        id: changes
        run: |
          if git diff --quiet -- assets/Shotguns.json assets/asset-manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${{ steps.review_branch.outputs.remote_branch_exists }}" != 'true' ]; then
            git switch -c automation/shotguns-weekly
          fi
          git add assets/Shotguns.json assets/asset-manifest.json
          git commit -m "data: reconcile weekly Shotguns"
          if [ "${{ steps.review_branch.outputs.remote_branch_exists }}" = 'true' ]; then
            git push --force-with-lease origin HEAD:automation/shotguns-weekly
          else
            git push origin HEAD:automation/shotguns-weekly
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create or update Shotguns review pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body_file="$RUNNER_TEMP/shotguns-pr-body.md"
          cat > "$body_file" <<'EOF'
          ## Automated weekly Shotguns reconciliation

          This job fetched the configured ESPN league server-side and added owed Shotgun records for finalized started players scoring zero or below.

          - No ESPN credential is committed or exposed to the static site.
          - Review the player lineup and score evidence before merging.
          - Video fulfillment remains a separate media upload and data update.
          EOF
          pr_number="$(gh pr list --head automation/shotguns-weekly --base main --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --body-file "$body_file"
          else
            gh pr create --base main --head automation/shotguns-weekly --title 'data: reconcile weekly Shotguns' --body-file "$body_file"
          fi
